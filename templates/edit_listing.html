{% extends "base.html" %}
{% block content %}
<div class="form-box" style="max-width: 760px;">
    <h1 style="font-size: 36px; font-weight: 800; margin-bottom: 10px;">Edit Listing</h1>
    <p style="font-size: 14px; color: #767676; margin-bottom: 30px;">Update your item details and add more images if needed.</p>

    <form action="/listing/{{ product.id }}/edit" method="POST" enctype="multipart/form-data" style="display: grid; gap: 16px;">
        <div class="form-group">
            <label>Product Title</label>
            <input type="text" name="title" required value="{{ product.title }}">
        </div>
        <div class="form-group">
            <label>Brand</label>
            <input type="text" name="brand" required value="{{ product.brand }}">
        </div>
        <div class="form-group">
            <label>Category</label>
            <select name="category" required>
                {% for option in ['Clothing', 'Shoes', 'Accessories', 'Vintage', 'Streetwear'] %}
                    <option value="{{ option }}" {% if product.category == option %}selected{% endif %}>{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Size</label>
                <input type="text" name="size" required value="{{ product.size }}">
            </div>
            <div class="form-group">
                <label>Color</label>
                <input type="text" name="color" required value="{{ product.color }}">
            </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    {% for option in ['Unisex', 'Male', 'Female', 'Other'] %}
                        <option value="{{ option }}" {% if product.gender == option %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Times Worn</label>
                <input type="number" name="times_worn" min="0" required value="{{ product.times_worn }}">
            </div>
        </div>
        <div class="form-group">
            <label>Seller Condition</label>
            <input type="text" name="seller_condition" required value="{{ product.seller_condition }}">
        </div>
        <div class="form-group">
            <label>Any Tears or Marks?</label>
            <select name="has_tears" required>
                <option value="No" {% if product.has_tears == 'No' %}selected{% endif %}>No</option>
                <option value="Yes" {% if product.has_tears == 'Yes' %}selected{% endif %}>Yes</option>
            </select>
        </div>
        <div class="form-group">
            <label>Seller Address</label>
            <input type="text" name="seller_address" required value="{{ product.seller_address }}">
        </div>
        <div class="form-group">
            <label>Asking Price (PKR)</label>
            <input type="number" name="asking_price" step="0.01" required value="{{ product.asking_price }}">
        </div>
        <div class="form-group">
            <label>Upload Additional Images</label>
            <input type="file" name="images" accept="image/*" multiple>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4">{{ product.description }}</textarea>
        </div>
        <div class="form-group">
            <label>Tags</label>
            <input type="text" name="tags" placeholder="e.g. vintage, denim, streetwear" value="{{ product.tags }}">
        </div>
        <button type="submit" class="btn-submit">Save Changes</button>
    </form>
</div>
{% endblock %}
