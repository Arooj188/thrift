{% extends "base.html" %}
{% block content %}
<div class="form-box" style="max-width: 650px;">
    <h1 style="font-size: 42px; font-weight: 800; margin: 0 0 10px 0;">Checkout</h1>
    <p style="font-size: 14px; color: #767676; margin-bottom: 50px;">Secure settlement layout. Order details update directly to the host master administration logs.</p>
    
    <div style="background: #f2efea; padding: 20px; border-radius: 6px; margin-bottom: 40px; font-size: 14px; display: flex; justify-content: space-between; font-weight: 700;">
        <span>Bag Total Due:</span>
        <span>Rs. {{ "{:,.2f}".format(total) }}</span>
    </div>

    <form action="/place_order" method="POST">
        <div style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #1c1c1c; margin-bottom: 30px; border-bottom: 1px solid #e8e4dc; padding-bottom: 10px;">Shipping</div>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="buyer_name" required>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="buyer_email" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="buyer_phone" required placeholder="e.g. 03001234567">
        </div>
        <div class="form-group">
            <label>Address</label>
            <input type="text" name="buyer_address_street" required placeholder="House No, Street Name, Sector/Block">
        </div>
        <div class="form-group">
            <label>City</label>
            <input type="text" name="buyer_city" required placeholder="e.g. Lahore, Islamabad">
        </div>
        <div class="form-group">
            <label>Province</label>
            <input type="text" name="buyer_province" required placeholder="e.g. Punjab, Sindh">
        </div>
        <div class="form-group">
            <label>Postal Code</label>
            <input type="text" name="buyer_postal_code" required>
        </div>
        <div class="form-group">
            <label>Delivery Note</label>
            <input type="text" name="delivery_note" placeholder="Leave any special courier instructions here">
        </div>
        
        <button type="submit" class="btn-submit" style="margin-top: 20px; padding: 20px;">Place Order</button>
    </form>
</div>
{% endblock %}
