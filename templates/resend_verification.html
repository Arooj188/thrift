{% extends "base.html" %}

{% block content %}
<div class="form-box" style="max-width: 400px; margin: 40px auto;">
    <h2 style="font-family: Georgia, serif; margin-bottom: 10px; font-size: 28px; font-weight: 400; color: #1c1c1c;">Resend Verification Email</h2>
    <p style="font-size: 14px; color: #767676; margin-bottom: 30px;">
        Enter your email address and we will send you a new verification link.
    </p>

    <form action="/resend-verification" method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required style="width: 100%; padding: 12px 14px; border: 1px solid #dcd7ce; background-color: #fbf9f6; border-radius: 8px; font-size: 15px; color: #1c1c1c; outline: none;">
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 10px; width: 100%;">Send Verification Email</button>
    </form>

    <p style="font-size: 13px; color: #767676; margin-top: 20px; text-align: center;">
        <a href="/login" style="color: #1c1c1c; font-weight: 600; text-decoration: none;">Back to Login</a>
    </p>
</div>
{% endblock %}
