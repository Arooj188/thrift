{% extends "base.html" %}
{% block content %}
<div style="max-width:1100px;">
    <h1 style="font-size:28px; font-weight:800; margin-bottom:10px;">Listings</h1>
    <div style="background:white; border:1px solid #e5e7eb; border-radius:12px; overflow:auto;">
        <table style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="text-align:left; color:#767676; font-size:12px;">
                    <th style="padding:12px;">Product</th>
                    <th style="padding:12px;">Price</th>
                    <th style="padding:12px;">Seller</th>
                    <th style="padding:12px;">Status</th>
                    <th style="padding:12px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for l in listings %}
                <tr style="border-top:1px solid #f2efea;">
                    <td style="padding:12px; font-size:13px;">{{ l.title }}</td>
                    <td style="padding:12px; font-size:13px;">Rs. {{ "{:,.2f}".format(l.asking_price) }}</td>
                    <td style="padding:12px; font-size:13px;">{{ l.seller_id or '–' }}</td>
                    <td style="padding:12px; font-size:13px;">{{ l.status }}</td>
                    <td style="padding:12px; font-size:13px;">
                        <form action="/admin/listing/{{ l.id }}/delete" method="POST" onsubmit="return confirm('Delete listing?');">
                            <button type="submit" style="padding:8px 12px; border-radius:8px;">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
