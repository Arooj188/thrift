{% extends "base.html" %}
{% block content %}
<div class="form-box" style="max-width: 600px; margin: 40px auto; text-align: center;">
    <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 16px;">Messages</h1>
    <p style="font-size: 14px; color: #767676; margin-bottom: 24px; line-height: 1.6;">
        In-app messaging between buyers and sellers is coming soon. For now, please use the contact details provided during checkout.
    </p>
    <a href="/" class="btn-submit" style="text-decoration: none; padding: 12px 24px; display: inline-block; width: auto;">Back to Marketplace</a>
</div>
<style>
    @media (max-width: 768px) {
        .form-box { margin: 16px; padding: 24px; }
        .form-box .btn-submit { width: 100%; }
    }
</style>
{% endblock %}
