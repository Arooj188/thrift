{% extends "base.html" %}
{% block content %}
<div class="form-box" style="margin-top: 20px;">
    <h2 style="font-family: Georgia, serif; margin-bottom: 5px; font-size: 28px; font-weight: 400; color: #1c1c1c;">Log In</h2>
    <p style="font-size: 13px; color: #767676; margin-bottom: 30px;">Sign in to manage your wardrobe listings, track marketplace payouts, and ship items.</p>
    
    <form action="/login" method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" name="password" id="loginPassword" required style="flex: 1; padding-right: 45px;">
                <button type="button" id="loginTogglePassword" style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; padding: 6px; font-size: 18px; color: #767676;" aria-label="Toggle password visibility">
                    <span id="loginEye">👁️</span>
                </button>
                <div class="bear-wrapper" id="loginBear">
                    <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="52" r="38" fill="#8B5E3C"/>
                        <circle cx="26" cy="28" r="12" fill="#8B5E3C"/>
                        <circle cx="74" cy="28" r="12" fill="#8B5E3C"/>
                        <circle cx="26" cy="28" r="6" fill="#D2A679"/>
                        <circle cx="74" cy="28" r="6" fill="#D2A679"/>
                        <circle cx="38" cy="48" r="5" fill="white" class="bear-eye"/>
                        <circle cx="62" cy="48" r="5" fill="white" class="bear-eye"/>
                        <circle cx="38" cy="48" r="2" fill="#1c1c1c" class="bear-pupil"/>
                        <circle cx="62" cy="48" r="2" fill="#1c1c1c" class="bear-pupil"/>
                        <ellipse cx="20" cy="62" rx="9" ry="6" fill="#8B5E3C" class="bear-hand left-hand"/>
                        <ellipse cx="80" cy="62" rx="9" ry="6" fill="#8B5E3C" class="bear-hand right-hand"/>
                        <ellipse cx="50" cy="72" rx="18" ry="12" fill="#D2A679"/>
                        <circle cx="44" cy="70" r="2" fill="#1c1c1c"/>
                        <circle cx="56" cy="70" r="2" fill="#1c1c1c"/>
                        <path d="M46 78 Q50 82 54 78" stroke="#1c1c1c" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 10px;">Sign In</button>
    </form>
    <p style="font-size: 13px; color: #767676; margin-top: 25px; text-align: center;">
        New to our marketplace? <a href="/signup" style="color: #1c1c1c; font-weight: 600; text-decoration: none;">Create a Seller Account</a>
    </p>
    <p style="font-size: 13px; color: #767676; margin-top: 12px; text-align: center;">
        <a href="/resend-verification" style="color: #1c1c1c; font-weight: 600; text-decoration: none;">Resend verification email</a>
    </p>
</div>
<style>
.bear-wrapper {
  display: inline-flex;
  align-items: center;
  margin-left: 8px;
  transition: opacity 0.2s ease;
}
.bear-hand {
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  transform-origin: center;
}
.bear-pupil {
  transition: opacity 0.15s ease;
}
.password-hidden .left-hand {
  transform: translate(14px, -10px) rotate(-10deg);
}
.password-hidden .right-hand {
  transform: translate(-14px, -10px) rotate(10deg);
}
.password-hidden .bear-pupil {
  opacity: 0;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const pwdInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('loginTogglePassword');
    const eye = document.getElementById('loginEye');
    const bearWrapper = document.getElementById('loginBear');
    if (!pwdInput || !toggleBtn || !bearWrapper) return;

    function updateBearState() {
        if (pwdInput.type === 'password') {
            bearWrapper.classList.add('password-hidden');
            eye.textContent = '👁️';
        } else {
            bearWrapper.classList.remove('password-hidden');
            eye.textContent = '🔒';
        }
    }

    updateBearState();
    toggleBtn.addEventListener('click', function() {
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
        } else {
            pwdInput.type = 'password';
        }
        updateBearState();
    });
});
</script>
{% endblock %}
